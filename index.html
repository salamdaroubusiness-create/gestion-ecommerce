<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; media-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSC Business Center | Plateforme de gestion e-commerce</title>
<style>
:root{--bg:#F5F6F8;--cd:#fff;--tx:#1F2937;--mu:#6B7280;--bd:#E5E7EB;--ac:#EBE9F7;--in:#29235C;--mg:#E6007E;--pu:#4A4398;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122B;--cd:#1E1B3F;--tx:#EEF;--mu:#A5A3C7;--bd:#38356A;--ac:#2B2760;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122B;--cd:#1E1B3F;--tx:#EEF;--mu:#A5A3C7;--bd:#38356A;--ac:#2B2760;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Arial,Helvetica,sans-serif}
header{background:var(--in);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px}
header img{height:46px}header div{flex:1}header b{font-size:17px;display:block}header small{opacity:.8}
.r{background:var(--mg);padding:3px 10px;border-radius:12px;font-size:12px}
nav{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto}
nav button{border:0;background:var(--ac);color:var(--tx);padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--mg);color:#fff;font-weight:700}
main{padding:16px 18px;max-width:1200px;margin:auto}
.an{background:var(--ac);border-left:4px solid var(--mg);padding:8px 14px;margin:10px 18px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--ac);border-radius:10px;padding:12px}.k small{color:var(--mu);font-size:11px;text-transform:uppercase}.k b{display:block;font-size:20px;color:var(--in)}
@media(prefers-color-scheme:dark){.k b{color:#fff}}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px;color:var(--mg)}
.w{overflow-x:auto;margin-bottom:8px}table{border-collapse:collapse;width:100%}
th{background:var(--ac);font-size:11px;text-transform:uppercase;padding:7px;text-align:left;white-space:nowrap}th.c{background:var(--pu);color:#fff}
td{padding:4px;border-bottom:1px solid var(--bd);white-space:nowrap}td.c{padding:4px 8px}
input,select,textarea{font:inherit;color:#0000FF;background:#FFFBEA;border:1px solid var(--bd);border-radius:6px;padding:5px 7px;width:100%;min-width:70px}
td input[type=number]{width:90px}
.b,.x{border:0;border-radius:6px;cursor:pointer;font:inherit}.b{background:var(--in);color:#fff;padding:8px 14px}.x{background:none;color:var(--mg);font-size:18px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.f label{font-size:12px;color:var(--mu);display:block}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:14px;background:var(--mg);border-radius:4px}.bar span{width:150px;overflow:hidden;text-overflow:ellipsis}
.ok{color:#0a7d3b}.no{color:#c0262d}.mu{color:var(--mu);font-size:12px}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js" defer></script>
<script src="abonnement.js" defer></script></body></html>
